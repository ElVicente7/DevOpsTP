name: CI/CD Pipeline

on:
  push:
    branches: [ "dev", "val", "prod" ]
  pull_request:
    branches: [ "dev", "val", "prod" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer et tester le backend
        working-directory: ./backend
        run: |
          npm ci
          npm test --if-present

  build-and-push:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/val' || github.ref == 'refs/heads/prod')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/tp-backend:${{ github.ref_name }}

      - name: Build et Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/tp-frontend:${{ github.ref_name }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Déployer sur Kubernetes (${{ github.ref_name }})
        run: |
          sed -i "s/VOTRE_COMPTE_DOCKERHUB/${{ secrets.DOCKER_USERNAME }}/g" k8s/app-deployment.yaml
          sed -i "s/IMAGE_TAG/${{ github.ref_name }}/g" k8s/app-deployment.yaml
          kubectl apply -f k8s/mysql-config.yaml -n ${{ github.ref_name }}
          kubectl apply -f k8s/mysql-deployment.yaml -n ${{ github.ref_name }}
          kubectl apply -f k8s/app-deployment.yaml -n ${{ github.ref_name }}
          kubectl rollout restart deployment/backend -n ${{ github.ref_name }}
          kubectl rollout restart deployment/frontend -n ${{ github.ref_name }}
